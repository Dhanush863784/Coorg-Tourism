# Initial Administrator Setup
# To configure the initial administrator securely, do NOT hard-code credentials here.
# Instead, set the following environment variables when starting the application:
# ADMIN_SETUP_ENABLED=true
# ADMIN_SETUP_EMAIL=your.secure.admin@example.com
# ADMIN_SETUP_PASSWORD=yourStrongSecretPassword!
admin.setup.enabled=${ADMIN_SETUP_ENABLED:true}
admin.setup.email=${ADMIN_SETUP_EMAIL:admin@coorgtourism.com}
admin.setup.password=${ADMIN_SETUP_PASSWORD:Password123!}